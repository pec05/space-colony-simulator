spring:
  application:
    name: space-colony-simulator

  datasource:
    url: jdbc:mysql://localhost:3306/space_colony?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns schema; Hibernate only validates
    show-sql: false               # flip to true while debugging
    open-in-view: false           # always false in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Simulation config — we will use this in Step 4 (Scheduler)
simulation:
  tick:
    rate-seconds: 10000          # 10 seconds in dev (change to 60000 in prod)
    sim-hours-per-tick: 1         # 1 tick = 1 sim hour

logging:
  level:
    com.spacecolony: DEBUG
    org.flywaydb: INFO