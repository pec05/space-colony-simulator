spring:
  application:
    name: space-colony-simulator

  datasource:
    url: jdbc:mysql://localhost:3306/space_colony?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns schema; Hibernate only validates
    show-sql: false               # flip to true while debugging
    open-in-view: false           # always false in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Simulation config — we will use this in Step 4 (Scheduler)
simulation:
  tick:
    rate-seconds: 10000          # 10 seconds in dev (change to 60000 in prod)
    sim-hours-per-tick: 1         # 1 tick = 1 sim hour
    trade-transit-hours: 2       # hours it takes for trade ships to arrive at their destination

logging:
  level:
    com.peccio.space_colony_simulator: DEBUG
    org.flywaydb: INFO

server:
  error:
    include-message: always
    include-binding-errors: always

security:
  jwt:
    # 256-bit Base64 encoded secret — change this in production!
    secret: dGhpcy1pcy1hLXNlY3VyZS1kZXYtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctaW4tc3BhY2UtY29sb255LXNpbXVsYXRvcg==
    expiration-ms: 86400000   # 24 hours